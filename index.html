<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ozark Comfort — Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #1f2937;
    --blue: #2c5f8a;
    --orange: #d9782d;
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #e2e5e9;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  #root { min-height: 100vh; }
  .center { display:flex; align-items:center; justify-content:center; height:100vh; color: var(--muted); font-size:16px; }
  .page { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
  .header { display:flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; border-bottom: 2px solid var(--blue); padding-bottom: 20px; margin-bottom: 28px; }
  .h1 { margin:0; font-size: 26px; font-weight:700; color: var(--navy); }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stat-bar { display:flex; gap: 24px; }
  .stat { text-align:center; }
  .stat-value { font-size: 22px; font-weight:700; color: var(--blue); }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .columns { display:grid; grid-template-columns: 1.3fr 1fr; gap: 28px; }
  @media (max-width: 800px) { .columns { grid-template-columns: 1fr; } }
  .section-title { font-size: 15px; font-weight:700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--navy); margin: 0 0 14px; }
  .date-group { margin-bottom: 20px; }
  .date-label { font-size: 13px; font-weight:600; color: var(--blue); margin-bottom: 8px; }
  .tech-group { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .tech-name { font-weight:600; font-size: 13px; color: var(--navy); margin-bottom: 6px; }
  .job-row { padding: 6px 0; border-top: 1px solid var(--border); }
  .job-row:first-of-type { border-top: none; padding-top: 0; }
  .job-main { display:flex; justify-content: space-between; font-size: 14px; }
  .job-type { color: var(--text); font-weight:500; }
  .customer-name { color: var(--muted); }
  .job-notes { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-style: italic; }
  .quote-row { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--orange); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .quote-age { font-size: 12px; font-weight:600; color: var(--orange); }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect } = React;

const SUPABASE_URL = 'https://stcedpfozkvanmiwkdlb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_WP6YLXEf6TOyaYqPJMGgsg_V1Iv_PYu';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatDateLabel(dateStr) {
  const t = new Date(todayISO() + 'T00:00:00');
  const d = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((d - t) / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Tomorrow';
  if (diffDays === -1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

function daysAgoLabel(dateStr) {
  const today = new Date(todayISO() + 'T00:00:00');
  const d = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return 'quoted today';
  if (diff === 1) return 'quoted 1 day ago';
  if (diff > 1) return `quoted ${diff} days ago`;
  return 'quoted (upcoming)';
}

function groupByTechnician(jobs) {
  const map = {};
  jobs.forEach((j) => {
    const tech = j.technician || 'Unassigned';
    if (!map[tech]) map[tech] = [];
    map[tech].push(j);
  });
  return Object.entries(map);
}

function App() {
  const [scheduled, setScheduled] = useState([]);
  const [quotes, setQuotes] = useState([]);
  const [customerCount, setCustomerCount] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    async function load() {
      try {
        const schedReq = supabase
          .from('jobs')
          .select('id, job_type, status, job_date, technician, notes, customers(name)')
          .eq('status', 'scheduled')
          .order('job_date', { ascending: true });

        const quoteReq = supabase
          .from('jobs')
          .select('id, job_type, status, job_date, notes, customers(name)')
          .eq('status', 'quoted')
          .order('job_date', { ascending: true });

        const custReq = supabase
          .from('customers')
          .select('*', { count: 'exact', head: true });

        const [schedRes, quoteRes, custRes] = await Promise.all([schedReq, quoteReq, custReq]);

        if (schedRes.error) throw schedRes.error;
        if (quoteRes.error) throw quoteRes.error;
        if (custRes.error) throw custRes.error;

        setScheduled(schedRes.data || []);
        setQuotes(quoteRes.data || []);
        setCustomerCount(custRes.count);
      } catch (e) {
        setError(e.message || String(e));
      } finally {
        setLoading(false);
      }
    }
    load();
  }, []);

  if (loading) {
    return <div className="center">Loading Ozark Comfort dashboard…</div>;
  }
  if (error) {
    return <div className="center">Couldn't load data — {error}</div>;
  }

  const byDate = {};
  scheduled.forEach((job) => {
    if (!byDate[job.job_date]) byDate[job.job_date] = [];
    byDate[job.job_date].push(job);
  });
  const dateKeys = Object.keys(byDate).sort();

  return (
    <div className="page">
      <div className="header">
        <div>
          <h1 className="h1">Ozark Comfort Heating &amp; Cooling</h1>
          <div className="subtitle">Operations Dashboard</div>
        </div>
        <div className="stat-bar">
          <div className="stat">
            <div className="stat-value">{customerCount ?? '—'}</div>
            <div className="stat-label">Active Customers</div>
          </div>
          <div className="stat">
            <div className="stat-value">{scheduled.length}</div>
            <div className="stat-label">Scheduled Jobs</div>
          </div>
          <div className="stat">
            <div className="stat-value">{quotes.length}</div>
            <div className="stat-label">Open Quotes</div>
          </div>
        </div>
      </div>

      <div className="columns">
        <div>
          <h2 className="section-title">Schedule by Technician</h2>
          {dateKeys.length === 0 && <div className="empty">Nothing scheduled right now.</div>}
          {dateKeys.map((date) => (
            <div className="date-group" key={date}>
              <div className="date-label">{formatDateLabel(date)}</div>
              {groupByTechnician(byDate[date]).map(([tech, jobs]) => (
                <div className="tech-group" key={tech}>
                  <div className="tech-name">{tech}</div>
                  {jobs.map((job) => (
                    <div className="job-row" key={job.id}>
                      <div className="job-main">
                        <span className="job-type">{job.job_type}</span>
                        <span className="customer-name">{job.customers ? job.customers.name : ''}</span>
                      </div>
                      {job.notes && <div className="job-notes">{job.notes}</div>}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          ))}
        </div>

        <div>
          <h2 className="section-title">Open Quotes — Needs Follow-Up</h2>
          {quotes.length === 0 && <div className="empty">No open quotes.</div>}
          {quotes.map((q) => (
            <div className="quote-row" key={q.id}>
              <div className="job-main">
                <span className="customer-name">{q.customers ? q.customers.name : ''}</span>
                <span className="quote-age">{daysAgoLabel(q.job_date)}</span>
              </div>
              <div className="job-type">{q.job_type}</div>
              {q.notes && <div className="job-notes">{q.notes}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
  // The app source above is loaded as type="text/plain" so Babel's own
  // automatic script scanner never touches it. On some hosts that scanner
  // fires on its own AND our own trigger fires too, which transforms and
  // runs the app code twice -- the second run throws ("Identifier 'supabase'
  // has already been declared") and the page ends up blank. Reading the
  // source ourselves and running Babel.transform() + eval() exactly once
  // avoids that double-execution entirely.
  var appSource = document.getElementById('app-source').textContent;
  var compiled = Babel.transform(appSource, { presets: ['react'] }).code;
  (0, eval)(compiled);
</script>
</body>
</html>
