function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatDateLabel(dateStr) {
  const t = new Date(todayISO() + 'T00:00:00');
  const d = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((d - t) / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Tomorrow';
  if (diffDays === -1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

function daysAgoLabel(dateStr) {
  const today = new Date(todayISO() + 'T00:00:00');
  const d = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return 'quoted today';
  if (diff === 1) return 'quoted 1 day ago';
  if (diff > 1) return `quoted ${diff} days ago`;
  return 'quoted (upcoming)';
}

function groupByTechnician(jobs) {
  const map = {};
  jobs.forEach((j) => {
    const tech = j.technician || 'Unassigned';
    if (!map[tech]) map[tech] = [];
    map[tech].push(j);
  });
  return Object.entries(map);

async function callAgent(prompt) {
  const res = await fetch('/api/agent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error || `Request failed (${res.status})`);
  }
  return data.text || '';
}

const ACCOUNTS = { rep: 'rep', office: 'office', admin: 'admin' };

function Login({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    const key = username.trim().toLowerCase();
    if (ACCOUNTS[key] && ACCOUNTS[key] === password) {
      setError('');
      onLogin(key);
    } else {
      setError('Incorrect username or password.');
    }
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <p className="login-eyebrow">HVAC &middot; Mid-Missouri</p>
        <h1 className="login-title">Ozark Comfort</h1>
        <p className="login-sub">Sign in to the dispatch dashboard</p>
        {error && <div className="login-error">{error}</div>}
        <form onSubmit={handleSubmit}>
          <div className="login-field">
            <label htmlFor="login-username">Username</label>
            <input id="login-username" type="text" value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username" autoFocus />
          </div>
          <div className="login-field">
            <label htmlFor="login-password">Password</label>
            <input id="login-password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" />
          </div>
          <button type="submit" className="login-btn">Sign In</button>
        </form>
      </div>
    </div>
  );
}

function AgentNote({ label, busyText, text, error }) {
  return (
    <div className="agent-note">
      <div className="agent-note-label">{label}</div>
      {error ? `Couldn't get an answer just now — ${error}. Feel free to try again.` : (text || busyText)}
    </div>
  );
}

function SchedulingSuggestion({ item, techLoadText }) {
  const [state, setState] = useState({ status: 'idle', text: '', error: '' });

  async function run() {
    setState({ status: 'loading', text: '', error: '' });
    const prompt = `You are the scheduling assistant for Ozark Comfort Heating & Cooling, an HVAC company with three technicians: Marcus Whedbee, Jared Combs, and Tyler Rourke. A new inquiry needs to be slotted in. Suggest ONE specific technician and a specific day/time this week, and briefly explain your reasoning (workload balance and general service fit) in 3-4 sentences, confident and concrete, the way a sharp dispatcher would explain their call. Do not hedge with "it depends" — commit to a recommendation.\n\nCurrent scheduled workload (jobs not yet completed):\n${techLoadText}\n\nNew inquiry:\nCustomer request: "${item.snippet}"\nLikely job type: ${item.jobType}\nCustomer area: ${item.town}\n\nGive your recommendation.`;
    try {
      const text = await callAgent(prompt);
      setState({ status: 'done', text, error: '' });
    } catch (e) {
      setState({ status: 'done', text: '', error: e.message });
    }
  }

  return (
    <div className="inline-action-row">
      <button className="btn btn-sm" onClick={run} disabled={state.status === 'loading'}>
        {state.status === 'loading' ? 'Thinking…' : state.status === 'done' && !state.error ? 'Suggest Again' : 'Suggest Scheduling'}
      </button>
      {state.status !== 'idle' && (
        <AgentNote label="Scheduling Suggestion" busyText="Working on it…" text={state.text} error={state.error} />
      )}
    </div>
  );
}

function ReviewResponseDraft({ review }) {
  const [state, setState] = useState({ status: 'idle', text: '', error: '' });

  async function run() {
    setState({ status: 'loading', text: '', error: '' });
    const prompt = `You are drafting a public reply, as the owner of Ozark Comfort Heating & Cooling (a family-owned HVAC company), to a ${review.rating}-star ${review.source} review from ${review.author}: "${review.text}". Write a short, genuine-sounding public response (3-4 sentences) — warm and appreciative for a positive review, or calm, accountable, and non-defensive for a negative one (acknowledge the specific issue, no excuses, invite them to reach out directly). Do not sound like corporate PR.`;
    try {
      const text = await callAgent(prompt);
      setState({ status: 'done', text, error: '' });
    } catch (e) {
      setState({ status: 'done', text: '', error: e.message });
    }
  }

  return (
    <div className="inline-action-row">
      <button className="btn btn-sm" onClick={run} disabled={state.status === 'loading'}>
        {state.status === 'loading' ? 'Thinking…' : state.status === 'done' && !state.error ? 'Redraft' : 'Draft a Response'}
      </button>
      {state.status !== 'idle' && (
        <AgentNote label="Draft Response" busyText="Working on it…" text={state.text} error={state.error} />
      )}
    </div>
  );
}

function DigestGenerator({ contextText }) {
  const [state, setState] = useState({ status: 'idle', text: '', error: '' });

  async function run() {
    setState({ status: 'loading', text: '', error: '' });
    const prompt = `Write a short, warm, plain-English Monday-morning "here's what happened" weekly digest for the owner of Ozark Comfort Heating & Cooling, based ONLY on the data below. Cover what's scheduled, the open quote pipeline and which ones need attention most, where recent customers are coming from, and anything notable in the inbox. Keep it to a tight, scannable paragraph or two — this should read like a trusted assistant caught the owner up over coffee, not a report.\n\n${contextText}`;
    try {
      const text = await callAgent(prompt);
      setState({ status: 'done', text, error: '' });
    } catch (e) {
      setState({ status: 'done', text: '', error: e.message });
    }
  }

  return (
    <div>
      <button className="btn btn-primary btn-sm" onClick={run} disabled={state.status === 'loading'}>
        {state.status === 'loading' ? 'Generating…' : "Generate This Week's Digest"}
      </button>
      {state.status !== 'idle' && (
        <AgentNote label="This Week at Ozark Comfort" busyText="Working on it…" text={state.text} error={state.error} />
      )}
    </div>
  );
}

function ChatPanel({ contextFn, questions }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const threadRef = useRef(null);

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages]);

  async function ask(question) {
    if (!question.trim() || busy) return;
    setBusy(true);
    setMessages((m) => [...m, { role: 'user', text: question }, { role: 'assistant', text: '', pending: true }]);
    const prompt = `You are the assistant built into Ozark Comfort Heating & Cooling's dispatch tool. Answer helpfully and thoroughly, not tersely — give real, complete answers. Stay strictly grounded in the data below; if something isn't in it, say you don't have that information rather than guessing. If asked to draft a reply, write a short, friendly, professional draft the person can review and send themselves — never claim to have sent anything. If financial or attribution data is included below, the current login is authorized to see it.\n\n${contextFn()}\n\nQuestion: ${question}`;
    try {
      const text = await callAgent(prompt);
      setMessages((m) => {
        const next = m.slice(0, -1);
        next.push({ role: 'assistant', text });
        return next;
      });
    } catch (e) {
      setMessages((m) => {
        const next = m.slice(0, -1);
        next.push({ role: 'assistant', text: `Couldn't get an answer just now — ${e.message}. Feel free to try again.` });
        return next;
      });
    } finally {
      setBusy(false);
    }
  }

  function handleSend() {
    const val = input;
    setInput('');
    ask(val);
  }

  return (
    <div className="chat-panel">
      <div className="chat-head"><span className="chat-head-dot"></span><span className="chat-head-title">Ask the Assistant</span></div>
      <div className="chat-quick">
        {questions.map((q, i) => (
          <button key={i} className="chip" onClick={() => ask(q)} disabled={busy}>{q}</button>
        ))}
      </div>
      <div className="chat-thread" ref={threadRef}>
        {messages.length === 0 && <div className="chat-empty-hint">Try a quick question above, or type your own below — real answers from Claude, grounded in this dashboard's data.</div>}
        {messages.map((m, i) => (
          <div key={i} className={`chat-msg ${m.role}`}>{m.pending ? 'Thinking…' : m.text}</div>
        ))}
      </div>
      <div className="chat-input-row">
        <input
          type="text"
          placeholder="Ask about the schedule, quotes, or inbox…"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') handleSend(); }}
        />
        <button className="btn btn-primary" onClick={handleSend} disabled={busy}>Send</button>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(() => {
    try { return sessionStorage.getItem('ozark_role') || null; } catch (e) { return null; }
  });
  const [scheduled, setScheduled] = useState([]);
  const [quotes, setQuotes] = useState([]);
  const [customerCount, setCustomerCount] = useState(null);
  const [completedCount, setCompletedCount] = useState(null);
  const [referralCounts, setReferralCounts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!session) return;
    async function load() {
      try {
        const schedReq = supabase
          .from('jobs')
          .select('id, job_type, status, job_date, technician, notes, customers(name)')
          .eq('status', 'scheduled')
          .order('job_date', { ascending: true });

        const quoteReq = supabase
          .from('jobs')
          .select('id, job_type, status, job_date, notes, customers(name)')
          .eq('status', 'quoted')
          .order('job_date', { ascending: true });

        const custReq = supabase
          .from('customers')
          .select('*', { count: 'exact', head: true });

        const completedReq = supabase
          .from('jobs')
          .select('*', { count: 'exact', head: true })
          .eq('status', 'completed');

        const referralReq = supabase
          .from('customers')
          .select('referral_source');

        const [schedRes, quoteRes, custRes, completedRes, referralRes] = await Promise.all([
          schedReq, quoteReq, custReq, completedReq, referralReq,
        ]);

        if (schedRes.error) throw schedRes.error;
        if (quoteRes.error) throw quoteRes.error;
        if (custRes.error) throw custRes.error;
        if (completedRes.error) throw completedRes.error;
        if (referralRes.error) throw referralRes.error;

        setScheduled(schedRes.data || []);
        setQuotes(quoteRes.data || []);
        setCustomerCount(custRes.count);
        setCompletedCount(completedRes.count);

        const tally = {};
        (referralRes.data || []).forEach((row) => {
          const key = row.referral_source || 'Unknown';
          tally[key] = (tally[key] || 0) + 1;
        });
        const counts = Object.entries(tally)
          .map(([label, count]) => ({ label, count }))
          .sort((a, b) => b.count - a.count);
        setReferralCounts(counts);
      } catch (e) {
        setError(e.message || String(e));
      } finally {
        setLoading(false);
      }
    }
    load();
  }, [session]);

  function handleLogin(role) {
    setSession(role);
    try { sessionStorage.setItem('ozark_role', role); } catch (e) {}
  }

  function handleLogout() {
    setSession(null);
    try { sessionStorage.removeItem('ozark_role'); } catch (e) {}
  }

  if (!session) {
    return <Login onLogin={handleLogin} />;
  }

  if (loading) {
    return <div className="center">Loading Ozark Comfort dashboard…</div>;
  }
  if (error) {
    return <div className="center">Couldn't load data — {error}</div>;
  }

  const byDate = {};
  scheduled.forEach((job) => {
    if (!byDate[job.job_date]) byDate[job.job_date] = [];
    byDate[job.job_date].push(job);
  });
  const dateKeys = Object.keys(byDate).sort();

  const techLoad = {};
  scheduled.forEach((j) => { techLoad[j.technician] = (techLoad[j.technician] || 0) + 1; });
  const techLoadText = Object.keys(techLoad).length
    ? Object.entries(techLoad).map(([t, n]) => `${t}: ${n} job(s) already scheduled`).join('\n')
    : 'No technicians currently have scheduled jobs.';

  const scheduleText = scheduled.map((j) => `- ${formatDateLabel(j.job_date)}: ${j.job_type} for ${j.customers ? j.customers.name : 'unknown customer'} with ${j.technician}${j.notes ? ' — ' + j.notes : ''}`).join('\n') || '(nothing currently scheduled)';
  const quotesText = quotes.map((q) => `- ${q.customers ? q.customers.name : 'unknown customer'}: ${q.job_type}, ${daysAgoLabel(q.job_date)}${q.notes ? ' — ' + q.notes : ''}`).join('\n') || '(no open quotes)';
  const inboxText = COMPANY_INBOX.map((m) => `- From ${m.sender}${m.unread ? ' (unread)' : ''}: "${m.subject}" — ${m.snippet}`).join('\n');
  const referralText = referralCounts.map((r) => `- ${r.label}: ${r.count}`).join('\n') || '(no referral data yet)';

  function buildContext() {
    let text = `SCHEDULED JOBS (not yet completed):\n${scheduleText}\n\nOPEN QUOTES (need follow-up, oldest first matters most):\n${quotesText}\n\nCOMPANY INBOX (illustrative sample inbox):\n${inboxText}`;
    if (session === 'admin') {
      text += `\n\nADMIN-ONLY DATA (this login is authorized to see it — would not be shown to an Office or Rep login):\nCompleted jobs so far: ${completedCount}\nCurrently scheduled jobs: ${scheduled.length}\nOpen quotes awaiting follow-up: ${quotes.length}\nTotal active customers: ${customerCount}\nWhere customers came from:\n${referralText}`;
    }
    return text;
  }

  const quickQuestions = [
    "What's on today's schedule?",
    'Which quotes need follow-up most urgently?',
    'Draft a reply to the oldest open quote',
    'Summarize the company inbox',
  ];
  if (session === 'admin') quickQuestions.push('Where are most of our customers coming from?');

  return (
    <div className="page">
      <div className="topbar">
        <div className="topbar-left">Signed in as <strong>{session}</strong></div>
        <button className="btn" onClick={handleLogout}>Log Out</button>
      </div>

      <div className="header">
        <div>
          <p className="brand-eyebrow">HVAC &middot; Mid-Missouri</p>
          <h1 className="brand-name">Ozark Comfort Dispatch</h1>
          <div className="brand-sub">Operations Dashboard</div>
        </div>
        <div className="stat-strip">
          <div className="stat">
            <div className="stat-value">{customerCount ?? '—'}</div>
            <div className="stat-label">Active Customers</div>
          </div>
          <div className="stat">
            <div className="stat-value">{scheduled.length}</div>
            <div className="stat-label">Scheduled Jobs</div>
          </div>
          <div className="stat">
            <div className="stat-value">{quotes.length}</div>
            <div className="stat-label">Open Quotes</div>
          </div>
        </div>
      </div>

      <div className="preview-note">
        <span className="preview-dot"></span>
        <span><strong>What's real here:</strong> the schedule, quotes, customer count, and referral-source mix all come straight from Ozark Comfort's real database. The Company Inbox and Reviews below are an illustrative sample, standing in for real email/SMS/review connections. Every AI answer &mdash; chat, scheduling suggestions, review drafts, the weekly digest &mdash; is a real Claude response, not canned text.</span>
      </div>

      <div className="columns">
        <div>
          <div className="section-head">
            <h2 className="section-title">Schedule by Technician</h2>
            <span className="section-count">{scheduled.length} jobs</span>
          </div>
          {dateKeys.length === 0 && <div className="empty">Nothing scheduled right now.</div>}
          {dateKeys.map((date) => (
            <div className="date-group" key={date}>
              <div className="date-label">{formatDateLabel(date)}</div>
              {groupByTechnician(byDate[date]).map(([tech, jobs]) => {
                const meta = techMeta(tech);
                return (
                  <div className="tech-block" key={tech}>
                    <div className="tech-bar">
                      <span className="tech-initial" style={{ color: meta.fg, background: meta.bg }}>{meta.initial}</span>
                      <span className="tech-name">{tech}</span>
                    </div>
                    {jobs.map((job) => (
                      <div className="job-row" key={job.id}>
                        <div className="job-main">
                          <span className="job-type">{job.job_type}</span>
                          <span className="job-customer">{job.customers ? job.customers.name : ''}</span>
                          {job.notes && <span className="job-note">{job.notes}</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          ))}

          <div className="section-head" style={{ marginTop: 28 }}>
            <h2 className="section-title">Company Inbox</h2>
            <span className="section-count">illustrative sample</span>
          </div>
          <div className="inbox-list">
            {COMPANY_INBOX.map((m, i) => (
              <div className="inbox-item" data-unread={m.unread} key={i}>
                <span className="inbox-dot"></span>
                <div className="inbox-body">
                  <div className="inbox-top">
                    <span className="inbox-sender">{m.sender}</span>
                    {m.flag && <span className="inbox-flagtag">{m.flag}</span>}
                  </div>
                  <div className="inbox-subject">{m.subject}</div>
                  <div className="inbox-snippet">{m.snippet}</div>
                  {m.needsScheduling && <SchedulingSuggestion item={m} techLoadText={techLoadText} />}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="section-head">
            <h2 className="section-title">Open Quotes</h2>
            <span className="section-count">{quotes.length} open</span>
          </div>
          {quotes.length === 0 && <div className="empty">No open quotes.</div>}
          {quotes.map((q) => (
            <div className="quote-card" key={q.id}>
              <div className="quote-top">
                <span className="quote-customer">{q.customers ? q.customers.name : ''}</span>
                <span className="quote-age">{daysAgoLabel(q.job_date)}</span>
              </div>
              <div className="quote-type">{q.job_type}</div>
              {q.notes && <div className="job-note">{q.notes}</div>}
            </div>
          ))}

          <div className="section-head" style={{ marginTop: 28 }}>
            <h2 className="section-title">Reviews</h2>
            <span className="section-count">illustrative sample</span>
          </div>
          {REVIEWS.map((r, i) => (
            <div className="review-card" key={i}>
              <div className="review-top">
                <span className="review-author">{r.author} <span className="review-stars" data-rating={r.rating}>{'★'.repeat(r.rating)}{'☆'.repeat(5 - r.rating)}</span></span>
                <span className="review-source">{r.source}</span>
              </div>
              <div className="review-text">&ldquo;{r.text}&rdquo;</div>
              <ReviewResponseDraft review={r} />
            </div>
          ))}
        </div>
      </div>

      {session === 'admin' && (
        <div className="financials-section">
          <div className="section-head">
            <h2 className="section-title">Owner Overview</h2>
            <span className="section-count">admin only</span>
          </div>
          <div className="mini-stat-row">
            <div className="mini-stat">
              <div className="mini-stat-value">{completedCount ?? '—'}</div>
              <div className="mini-stat-label">Completed Jobs</div>
            </div>
            <div className="mini-stat">
              <div className="mini-stat-value">{scheduled.length}</div>
              <div className="mini-stat-label">Scheduled Jobs</div>
            </div>
            <div className="mini-stat">
              <div className="mini-stat-value">{quotes.length}</div>
              <div className="mini-stat-label">Open Quotes</div>
            </div>
          </div>

          <div className="section-head" style={{ marginTop: 8 }}>
            <h3 className="section-title" style={{ fontSize: 15 }}>Where Customers Come From</h3>
          </div>
          {referralCounts.length === 0 && <div className="empty">No referral data yet.</div>}
          {referralCounts.length > 0 && (() => {
            const max = Math.max(...referralCounts.map((r) => r.count));
            return referralCounts.map((r) => (
              <div className="attrib-row" key={r.label}>
                <span className="attrib-label">{r.label}</span>
                <span className="attrib-bar-track"><span className="attrib-bar-fill" style={{ width: `${Math.round((r.count / max) * 100)}%` }}></span></span>
                <span className="attrib-count">{r.count}</span>
              </div>
            ));
          })()}

          <div className="section-head" style={{ marginTop: 20 }}>
            <h3 className="section-title" style={{ fontSize: 15 }}>Weekly Owner Digest</h3>
          </div>
          <DigestGenerator contextText={buildContext()} />
        </div>
      )}

      <ChatPanel contextFn={buildContext} questions={quickQuestions} />

      <div className="section-head" style={{ marginTop: 32 }}>
        <h2 className="section-title">More Ways The Agent Can Help</h2>
        <span className="section-count">roadmap</span>
      </div>
      <div className="roadmap-grid">
        {ROADMAP_ITEMS.map((item, i) => (
          <div className="roadmap-card" key={i}>
            <div className="roadmap-icon">{item.icon}</div>
            <div className="roadmap-title">{item.title}</div>
            <div className="roadmap-desc">{item.desc}</div>
          </div>
        ))}
      </div>

      <footer>
        Ozark Comfort Heating &amp; Cooling is a fictional practice company built for Second Shift &mdash; no real customer data.
        <BrandMark />
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
  // The app source above is loaded as type="text/plain" so Babel's own
  // automatic script scanner never touches it. On some hosts that scanner
  // fires on its own AND our own trigger fires too, which transforms and
  // runs the app code twice -- the second run throws ("Identifier 'X'
  // has already been declared") and the page ends up blank. Reading the
  // source ourselves and running Babel.transform() + eval() exactly once
  // avoids that double-execution entirely.
  var appSource = document.getElementById('app-source').textContent;
  var compiled = Babel.transform(appSource, { presets: ['react'] }).code;
  (0, eval)(compiled);
</script>
